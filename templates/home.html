<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <meta name="description" content = "Turn Long URLs into Short links">
    <link rel = "preconnect" href="https://fonts.googleapis.com">
    <link rel = "preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2">
</head>
<body>
    <main>
        <section class="hero">
            <div class="eyebrow">
                <span class="status-dot"></span>
                Simple, Fast, and Reliable URL Shortener
            </div>
            <h1> Long Road?<br><span>Short Routes</span></h1>
            <p class="hero-description">Make your links shorter, cleaner and easier to share.</p>
            <div class="shortener-card" id="shorten">
                <div class="card-heading">
                    <h2>Shorten your link</h2>
                </div>
                <form action="/shorten" method="POST" class="url-form">
                    <label for="url">Your destination Url</label>
                    <div class="input-wrapper">
                        <input type="text" name="url" placeholder="Enter your URL here..." required>
                    </div>
                    <button type="submit" class="shorten-button">Shorten</button>
                </form>
                <div class="card-footer">
                    Easy. Fast. Reliable.
                </div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <p>Built with Flask.</p>
        <p>Shorten links with one click.</p>
    </footer>
</body>
</html>
